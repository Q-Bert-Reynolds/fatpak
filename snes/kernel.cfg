MEMORY {
  ZP: start=$0020, size=$00A0, type=rw;
  # Reserve $7E:6000..9FFF and $7F:C000..FFFF for the physical-row tile cache.
  # shared.s reserves $7E:A000..B67F and F000..FFFF; software stack is B680..BFFF.
  RAM: start=$2000, size=$4000, type=rw;
  IMAGE: start=$0000, size=$C000, file=%O;
  # The extension (map.s): $7E:DC00..FFFF, the 4 px cache's, sent in CODE commands; its own file.
  EXT: start=$DC00, size=$2400, file="%O.ext";
}
SEGMENTS {
  ZEROPAGE: load=ZP, type=zp;
  STARTUP: load=IMAGE, type=ro;
  CODE: load=IMAGE, type=ro;
  RODATA: load=IMAGE, run=RAM, type=ro, define=yes;
  DATA: load=IMAGE, run=RAM, type=rw, define=yes;
  BSS: load=RAM, type=bss, define=yes;
  FONTS: load=IMAGE, type=ro, define=yes;
  EXTHEAD: load=EXT, type=ro;
  EXT: load=EXT, type=ro, define=yes;
}
