MEMORY {
  ZP: start=$0020, size=$00A0, type=rw;
  RAM: start=$2000, size=$8000, type=rw;
  IMAGE: start=$0000, size=$FF00, file=%O;
}
SEGMENTS {
  ZEROPAGE: load=ZP, type=zp;
  STARTUP: load=IMAGE, type=ro;
  CODE: load=IMAGE, type=ro;
  RODATA: load=IMAGE, run=RAM, type=ro, define=yes;
  DATA: load=IMAGE, run=RAM, type=rw, define=yes;
  BSS: load=RAM, type=bss, define=yes;
  FONTS: load=IMAGE, type=ro, define=yes;
}
